name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (build extension + install deps)
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/ demos/

      - name: Format check
        run: uv run ruff format --check src/ tests/ demos/

      - name: Type check
        run: uv run mypy src/softcut/__init__.py tests/ --exclude '.venv'

      - name: Test
        run: uv run pytest tests/ -q

  # tinyosc is ON by default now, so every other leg already exercises the native
  # transport across all three OSes. What no longer has coverage is the build
  # *without* it -- the `#ifdef` -off path and the pure-Python (python-osc)
  # transport -- so this leg guards that instead.
  no-tinyosc:
    name: Without tinyosc (${{ matrix.os }})
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SKBUILD_CMAKE_DEFINE: SOFTCUT_ENABLE_TINYOSC=OFF
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build with the native transport disabled
        run: uv sync

      - name: Verify the native transport is absent
        # Guard against a cached build silently re-enabling it, which would make
        # this leg a duplicate of the others instead of covering the off path.
        run: uv run python -c "from softcut import _core; assert not _core.HAVE_TINYOSC, 'tinyosc still compiled in'; print('HAVE_TINYOSC off OK')"

      - name: Test (python-osc transport only)
        run: uv run pytest tests/ -q

  build-smoke:
    name: Build smoke (${{ matrix.os }} / py${{ matrix.python }})
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Build and install
        run: uv sync

      - name: Test
        run: uv run pytest tests/ -q
