[project]
name = "softcut-py"
version = "0.4.2"
description = "Python bindings for softcut-lib (the norns softcut DSP engine) with nanobind"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["nanobind", "python", "extension"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Pure-Python OSC transport for softcut.osc. An optional native transport
# (built-in tinyosc, CMake option SOFTCUT_ENABLE_TINYOSC) can replace this at
# runtime.
osc = [
    "python-osc>=1.8",
]

[dependency-groups]
dev = [
    # The suite and the demos are written in numpy, and the numpy-specific paths
    # (the ndarray return from render/process) need it to be exercised at all.
    "numpy>=1.21",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
    "twine>=6.2.0",
    "python-osc>=1.8",
    # Builds the TouchOSC surface in clients/touchosc; tests/test_touchosc.py
    # checks the generated layout against the OSC server's dispatch table.
    "py2tosc>=0.3.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["scikit-build-core>=0.12", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/softcut"]
cmake.args = []
cmake.define = {}
cmake.build-type = "Release"
cmake.source-dir = "."
# Force-include the native build inputs so the sdist always builds, regardless
# of git tracking/ignore state. Exclude the unused softcut-lib JACK/OSC client.
sdist.include = [
    "CMakeLists.txt",
    "src/softcut/_core.cpp",
    "thirdparty/softcut-lib/softcut-lib/include/**",
    "thirdparty/softcut-lib/softcut-lib/src/**",
    "thirdparty/softcut-lib/LICENSE.txt",
    "thirdparty/miniaudio/miniaudio.h",
    "thirdparty/miniaudio/miniaudio.c",
    "thirdparty/miniaudio/LICENSE",
    "thirdparty/tinyosc/tinyosc.h",
    "thirdparty/tinyosc/tinyosc.c",
    "thirdparty/tinyosc/LICENSE",
]
sdist.exclude = [
    "thirdparty/softcut-lib/clients/**",
    "tests/data/**",  # large demo audio fixtures; not needed to build/test the package
    "build/**",
]
wheel.exclude = [
    "*.cpp",
]

[tool.cibuildwheel]
# CPython 3.10-3.14 (matches requires-python); skip PyPy and musllinux. The
# `cp314-*` glob excludes free-threaded `cp314t` builds on purpose: the realtime
# command queue is single-producer and relies on the GIL on the Python side.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# PyPy is not enabled by default, so a `pp*` skip selector is a no-op that
# cibuildwheel warns about; only musllinux needs an explicit skip.
skip = "*-musllinux_*"
build-verbosity = 1
# Install the built wheel and run the suite on each target. numpy arrives via the
# wheel's own dependency; live-device tests skip without SOFTCUT_TEST_AUDIO.
test-requires = "pytest numpy"  # numpy only to exercise the interop tests
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.macos.environment]
# nanobind's C++17 code uses aligned new/delete, which is only available with a
# macOS deployment target of 10.13+. cibuildwheel's x86_64 default (10.9) fails
# to compile nanobind, so raise it to nanobind's recommended floor. arm64 builds
# already use a >=11.0 target.
MACOSX_DEPLOYMENT_TARGET = "10.14"
